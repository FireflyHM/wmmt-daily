# Publishes the static site in ./public to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Pages lets browsers cache files for 10 minutes. Tag the page's CSS and
      # scripts with this commit so a new index.html never runs with old ones.
      - name: Version asset links
        run: |
          sed -i -E "s#(href|src)=\"((css|js|data)/[^\"?]+)\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" public/index.html
          grep -E '\?v=' public/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
